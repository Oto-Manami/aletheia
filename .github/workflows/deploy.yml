name: サーバーの更新

# main への取り込みで、サーバー用の機械の API を最新にする（設計書 決定記録 0036。手順は ops/deploy/README.md）
# main の CI が成功した後に、そのコミットに合わせる。CI が失敗したコミットでは動かない

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      migrations_applied:
        description: 新しいマイグレーションの SQL を本番のデータベースに流し終えた
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: サーバーの API を最新にする
    if: >-
      github.repository == 'Oto-Manami/aletheia' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: server
    steps:
      - name: 設定を確かめる
        id: config
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::サーバーの更新の設定（環境 server のシークレット）がまだ無いため、更新しません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tailscale につなぐ
        if: steps.config.outputs.ready == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: サーバーを更新する
        if: steps.config.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APPLIED: ${{ inputs.migrations_applied }}
          # CI が成功したコミット（手で動かしたときは main の最新）
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          request=deploy
          if [ "$APPLIED" = "true" ]; then request="deploy --migrations-applied"; fi
          run() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "aletheia@$HOST" "$1" 2>&1 | tee result.txt
            return "${PIPESTATUS[0]}"
          }
          set +e
          run "$request $TARGET"
          status=$?
          # サーバーの更新のスクリプトが、コミットを受け取れない前の版のとき（この仕組みを入れた直後の 1 回だけ）。
          # 前の版は main の最新に合わせ、そのときにスクリプト自体も新しくなる
          if [ "$status" = 2 ] && grep -q "使えないコマンドです" result.txt; then
            run "$request"
            status=$?
          fi
          set -e
          {
            echo "### サーバーの更新"
            echo '```'
            cat result.txt
            echo '```'
            if [ "$status" = 3 ]; then
              echo "SQL を流し終えたら、Actions の「サーバーの更新」→「Run workflow」で「新しいマイグレーションの SQL を本番のデータベースに流し終えた」に印を付けて動かし直してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.ssh/deploy_key
          exit "$status"
