name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint・format・typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  rules:
    name: 規約（マイグレーション・ワークフロー・リンク）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.7
      LYCHEE_VERSION: 0.18.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: マイグレーションの規約（取り込み済みのものを書き換えていないか）
        run: sh scripts/check-migrations.sh "origin/${{ github.base_ref || 'main' }}"
      - name: ワークフローの検査（actionlint）
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz actionlint
          ./actionlint
      - name: ドキュメントのリンク切れ（リポジトリ内）
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          ./lychee --offline --no-progress --include-fragments --exclude-path node_modules '**/*.md'

  secrets:
    name: 鍵の混入チェック
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を用意する
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: 履歴全体を検査する
        run: ./gitleaks git --redact --no-banner --verbose .

  db:
    name: データベースのテスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: データベースを立ち上げ、マイグレーションを適用する
        run: supabase db start
      - name: 関数の静的検査（plpgsql_check）
        run: supabase db lint --local --level warning --fail-on warning
      - name: 型の定義がデータベースと一致しているか
        run: pnpm --filter @aletheia/db check:types
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: テスト
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: データベースのログ（失敗時）
        if: failure()
        run: docker logs supabase_db_aletheia --tail 200
