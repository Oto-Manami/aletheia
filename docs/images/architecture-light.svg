<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>aletheia のシステム構成</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#9aa8b4"/></marker></defs>
<text x="20" y="16" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#7a8a98">使う人</text>
<text x="330" y="16" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#7a8a98">処理</text>
<text x="650" y="16" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#7a8a98">保存</text>
<rect x="20" y="40" width="180" height="70" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="110.0" y="69.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">閲覧サイト</text><text x="110.0" y="88.5" text-anchor="middle" font-size="11.5" fill="#5b6b79">Vercel・サーバーを持たない</text>
<rect x="650" y="30" width="230" height="130" rx="14" fill="#5fb3e6" stroke="#5fb3e6" stroke-width="1.5"/><text x="765.0" y="72.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Supabase</text><text x="765.0" y="91.5" text-anchor="middle" font-size="11.5" fill="#e8f5fd">PostgreSQL・全文検索（PGroonga）</text><text x="765.0" y="108.5" text-anchor="middle" font-size="11.5" fill="#e8f5fd">行レベルセキュリティ・変更履歴</text><text x="765.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#e8f5fd">Discord でのログイン</text>
<rect x="330" y="170" width="180" height="70" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="420.0" y="199.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">API</text><text x="420.0" y="218.5" text-anchor="middle" font-size="11.5" fill="#5b6b79">書き込みの窓口（承認など）</text>
<rect x="650" y="200" width="206" height="70" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="753.0" y="229.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">Google Drive</text><text x="753.0" y="248.5" text-anchor="middle" font-size="11.5" fill="#5b6b79">ファイル実体（画像・動画・HTML）</text>
<rect x="20" y="300" width="180" height="70" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="110.0" y="329.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">Discord</text><text x="110.0" y="348.5" text-anchor="middle" font-size="11.5" fill="#5b6b79">入口チャンネル・承認カード</text>
<rect x="330" y="300" width="180" height="70" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="420.0" y="329.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">Bot（Aletheia）</text><text x="420.0" y="348.5" text-anchor="middle" font-size="11.5" fill="#5b6b79">下書きを作る・カードを出す</text>
<rect x="650" y="300" width="230" height="84" rx="10" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.5"/><text x="765.0" y="328.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">バックアップ</text><text x="765.0" y="347.0" text-anchor="middle" font-size="11.5" fill="#5b6b79">GitHub Actions・読み取り専用</text><text x="765.0" y="364.0" text-anchor="middle" font-size="11.5" fill="#5b6b79">毎日 Drive・毎週 非公開の GitHub</text>
<rect x="20" y="396" width="200" height="64" rx="10" fill="#f1f5f8" stroke="#b6c2cc" stroke-width="1.5" stroke-dasharray="4 4"/><text x="120.0" y="414.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2a36">ファンサイト（予定）</text><text x="120.0" y="433.0" text-anchor="middle" font-size="11.5" fill="#5b6b79">公開用のビューから作る</text><text x="120.0" y="450.0" text-anchor="middle" font-size="11.5" fill="#5b6b79">public かつ承認済みだけ</text>
<path d="M200 75 H646" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-end="url(#a)"/>
<text x="423" y="66" text-anchor="middle" font-size="11.5" fill="#5b6b79">読む（ログインした人の権限のまま）</text>
<path d="M110 110 V205 H326" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-end="url(#a)"/>
<text x="218" y="197" text-anchor="middle" font-size="11.5" fill="#5b6b79">承認・修正</text>
<path d="M510 190 C585 190 575 140 646 140" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-end="url(#a)"/>
<text x="585" y="182" text-anchor="start" font-size="11.5" fill="#5b6b79">書き込み</text>
<path d="M510 222 C580 222 580 235 646 235" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-end="url(#a)"/>
<text x="580" y="252" text-anchor="start" font-size="11.5" fill="#5b6b79">ファイル</text>
<path d="M200 335 H326" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="263" y="326" text-anchor="middle" font-size="11.5" fill="#5b6b79">投稿・リアクション</text>
<path d="M420 300 V244" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-end="url(#a)"/>
<text x="428" y="277" text-anchor="start" font-size="11.5" fill="#5b6b79">下書き・承認</text>
<path d="M870 160 V296" fill="none" stroke="#9aa8b4" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
